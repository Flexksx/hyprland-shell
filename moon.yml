$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: 'configuration'

tasks:
  format:
    command: 'biome format --write .'
    toolchains: 'system'
    inputs:
      - '**/*.ts'
      - '**/*.tsx'
    options:
      runFromWorkspaceRoot: true

  lint:
    command: 'biome lint .'
    toolchains: 'system'
    inputs:
      - '**/*.ts'
      - '**/*.tsx'
    options:
      runFromWorkspaceRoot: true
